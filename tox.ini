[tox]
requires = tox-uv>=1.28.1
envlist =
    py3{10,11,12,13,14}-{module,ruff,mypy}
    ruff
    ruff-fix
    mypy
skip_missing_interpreters = True

[testenv]
# Every env installs from uv.lock, so tox, CI and .venv run the same tool versions.
runner = uv-venv-lock-runner
dependency_groups = dev
extras =
    minio
    plotly
    render
setenv =
    UV_SYSTEM_CERTS = true
    # A user-level uv.toml (e.g. exclude-newer) would make `uv sync --locked` re-resolve and fail.
    UV_NO_CONFIG = 1
passenv =
    HYPOTHESIS_PROFILE
commands =
    python3 -m pytest -m "not graph_outputs" --cov-config=pyproject.toml --cov=rdetoolkit --cov-report=html --cov-report=xml --cov-report=term-missing --cov-fail-under=80 {posargs:tests}

[testenv:py312-module]
commands =
    python3 -m pytest -m "not graph_outputs" --cov-config=pyproject.toml --cov=rdetoolkit --cov-report=html --cov-report=xml --cov-report=term-missing --cov-fail-under=80 {posargs:tests}
    python3 scripts/check_phase_h_coverage.py {posargs:}

[testenv:{ruff,py310-ruff,py311-ruff,py312-ruff,py313-ruff,py314-ruff}]
skip_install = true
uv_sync_flags = --no-install-project
commands =
    ruff check src/rdetoolkit/

[testenv:ruff-fix]
skip_install = true
uv_sync_flags = --no-install-project
commands =
    ruff check --fix src/rdetoolkit/

[testenv:{lizard,py310-lizard,py311-lizard,py312-lizard,py313-lizard,py314-lizard}]
skip_install = true
uv_sync_flags = --no-install-project
commands =
    # Due to not having been able to refactor.
    lizard src/rdetoolkit/workflows.py -C 16
    lizard src/rdetoolkit/__main__.py -C 10
    lizard src/rdetoolkit/  -C 10 -x src/rdetoolkit/workflows.py -x src/rdetoolkit/__main__.py

[testenv:{mypy,py310-mypy,py311-mypy,py312-mypy,py313-mypy,py314-mypy}]
skip_install = true
uv_sync_flags = --no-install-project
commands =
    mypy src/

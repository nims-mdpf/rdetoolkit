name: Build Test for Develop Branch PRs

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'develop/v*'
      - '!develop/v*_*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-build-multi-platform:
    name: Test Build on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    if: ${{ (
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'develop/v') && !contains(github.head_ref, '_')) ||
      (github.event_name != 'pull_request' && startsWith(github.ref_name, 'develop/v') && !contains(github.ref_name, '_'))
      ) && ! (
      (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'docs-') || startsWith(github.head_ref, 'docs/') || startsWith(github.head_ref, 'doc-') || startsWith(github.head_ref, 'doc/'))) ||
      (github.event_name != 'pull_request' && (startsWith(github.ref_name, 'docs-') || startsWith(github.ref_name, 'docs/') || startsWith(github.ref_name, 'doc-') || startsWith(github.ref_name, 'doc/')))
      ) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # develop/v2 push wheels are disposable; PRs retain the release matrix.
        python-version: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/develop/v2' && '["3.12"]' || '["3.10", "3.11", "3.12", "3.13", "3.14"]') }}
        include:
          - os: ubuntu-latest
            platform_name: Linux
          - os: windows-latest
            platform_name: Windows
          - os: macos-latest
            platform_name: macOS

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: |
          python -m pip install --upgrade pip
          pip install maturin

      - name: Build wheel with maturin
        run: |
          maturin build --release --out dist

      - name: Check built wheel
        shell: bash
        run: |
          echo "Built wheels:"
          ls -la dist/

      - name: Test wheel installation (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Create a virtual environment for testing
          python -m venv test_env

          # Activate virtual environment
          source test_env/bin/activate

          # Install the built wheel
          pip install dist/*.whl

          # Test import
          python -c "import rdetoolkit.core; print('Successfully imported rdetoolkit.core')"

      - name: Test wheel installation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Create a virtual environment for testing
          python -m venv test_env

          # Get the wheel file path
          $wheelFile = (Get-ChildItem dist\*.whl).FullName
          Write-Host "Installing wheel: $wheelFile"

          # Install using the venv's Python directly
          & test_env\Scripts\python.exe -m pip install --upgrade pip
          & test_env\Scripts\python.exe -m pip install $wheelFile

          # Test import using the venv's Python
          & test_env\Scripts\python.exe -c "import rdetoolkit.core; print('Successfully imported rdetoolkit.core')"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check typed distribution
        shell: bash
        env:
          UV_NO_CONFIG: 1
        run: |
          # Strict mypy against the installed wheel: catches stubs missing from
          # the wheel or never selected by the type checker (#736). mypy comes
          # from uv.lock, the same version as tox and v2 CI.
          uv run --isolated --frozen --only-group dev --python "${{ matrix.python-version }}" \
            python scripts/check_typed_distribution.py --wheel dist/*.whl

      - name: Agent readiness gate (#676)
        shell: bash
        env:
          UV_NO_CONFIG: 1
        run: |
          # The documented agent loop on all five modes, against this leg's
          # wheel and an installed Skills pack (docs/development/agent-readiness-gate.md).
          uv export --frozen --no-hashes --no-emit-project --all-groups --all-extras -o "$RUNNER_TEMP/constraints.txt"
          uv venv --python "${{ matrix.python-version }}" "$RUNNER_TEMP/gate-venv"
          if [ "$RUNNER_OS" = "Windows" ]; then gate_python="$RUNNER_TEMP/gate-venv/Scripts/python.exe"; else gate_python="$RUNNER_TEMP/gate-venv/bin/python"; fi
          uv pip install --python "$gate_python" -c "$RUNNER_TEMP/constraints.txt" dist/*.whl pytest
          python scripts/agent_readiness_gate.py --python "$gate_python" --work "$RUNNER_TEMP/agent-readiness"

      - name: Upload built wheels as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform_name }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
          # Zero preserves the repository's default retention for non-smoke builds.
          retention-days: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop/v2' && 3 || 0 }}

  test-build-cross-platform:
    name: Cross-platform Build Test
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/develop/v2') && (
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'develop/v') && !contains(github.head_ref, '_')) ||
      (github.event_name != 'pull_request' && startsWith(github.ref_name, 'develop/v') && !contains(github.ref_name, '_'))
      ) && ! (
      (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'docs-') || startsWith(github.head_ref, 'docs/') || startsWith(github.head_ref, 'doc-') || startsWith(github.head_ref, 'doc/'))) ||
      (github.event_name != 'pull_request' && (startsWith(github.ref_name, 'docs-') || startsWith(github.ref_name, 'docs/') || startsWith(github.ref_name, 'doc-') || startsWith(github.ref_name, 'doc/')))
      ) }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
        python-version: ["3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: stable
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist -i 3.10 3.11 3.12 3.13 3.14

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  summary:
    name: Build Test Summary
    needs: [test-build-multi-platform, test-build-cross-platform]
    runs-on: ubuntu-latest
    env:
      SMOKE_BUILD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop/v2' }}
      NATIVE_RESULT: ${{ needs.test-build-multi-platform.result }}
      CROSS_RESULT: ${{ needs.test-build-cross-platform.result }}
    if: ${{ always() && (
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'develop/v') && !contains(github.head_ref, '_')) ||
      (github.event_name != 'pull_request' && startsWith(github.ref_name, 'develop/v') && !contains(github.ref_name, '_'))
      ) && ! (
      (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'docs-') || startsWith(github.head_ref, 'docs/') || startsWith(github.head_ref, 'doc-') || startsWith(github.head_ref, 'doc/'))) ||
      (github.event_name != 'pull_request' && (startsWith(github.ref_name, 'docs-') || startsWith(github.ref_name, 'docs/') || startsWith(github.ref_name, 'doc-') || startsWith(github.ref_name, 'doc/')))
      ) }}

    steps:
      - name: Check build status
        run: |
          python - <<'PY'
          import os

          expected_cross = "skipped" if os.environ["SMOKE_BUILD"] == "true" else "success"
          results = {
              "native": (os.environ["NATIVE_RESULT"], "success"),
              "cross": (os.environ["CROSS_RESULT"], expected_cross),
          }
          for job, (actual, expected) in results.items():
              if actual != expected:
                  raise SystemExit(f"{job} build result: {actual!r}; expected {expected!r}")
          PY

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-wheels

      - name: Display all built wheels
        run: |
          echo "=== Successfully built wheels ==="
          find all-wheels -name "*.whl" -type f | sort
          echo ""
          echo "=== Build Summary ==="
          echo "Total wheels built: $(find all-wheels -name "*.whl" -type f | wc -l)"
          echo ""
          echo "=== Wheel sizes ==="
          find all-wheels -name "*.whl" -type f -exec ls -lh {} \;

      - name: Check expected artifacts
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          smoke = os.environ["SMOKE_BUILD"] == "true"
          versions = ["3.12"] if smoke else ["3.10", "3.11", "3.12", "3.13", "3.14"]
          expected = {
              f"wheels-{platform}-py{version}"
              for platform in ["Linux", "Windows", "macOS"]
              for version in versions
          }
          if not smoke:
              expected.update(
                  f"wheels-linux-{target}"
                  for target in [
                      "x86_64-unknown-linux-gnu",
                      "aarch64-unknown-linux-gnu",
                      "armv7-unknown-linux-gnueabihf",
                  ]
              )

          root = Path("all-wheels")
          actual = {entry.name for entry in root.iterdir()} if root.is_dir() else set()
          if actual != expected:
              raise SystemExit(
                  f"Artifact mismatch: missing={sorted(expected - actual)}, "
                  f"unexpected={sorted(actual - expected)}"
              )
          for name in sorted(expected):
              wheels = list((root / name).glob("*.whl"))
              if not wheels or any(not wheel.is_file() or wheel.stat().st_size == 0 for wheel in wheels):
                  raise SystemExit(f"Missing or empty wheels in artifact {name}")
          print(f"Build test completed successfully: {len(expected)} wheel artifacts verified")
          PY

name: Pytest and coverage measurement and create badges

on:
  pull_request:
    branches:
      - 'develop-*'
      - 'develop/**'
      - '!develop/v2'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ !(startsWith(github.head_ref, 'docs-') || startsWith(github.head_ref, 'docs/') ||
      startsWith(github.head_ref, 'doc-') || startsWith(github.head_ref, 'doc/')) }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup uv (Python 3.11)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            requirements-dev.lock
            pyproject.toml
      - name: Create venv (Python 3.11)
        run: uv venv .venv --python 3.11
      - name: Install dependencies (uv in venv)
        run: |
          source .venv/bin/activate
          uv pip install -r requirements-dev.lock
          uv pip install -e .
          uv pip install coverage-badge
      - name: Run pytest
        run: |
          source .venv/bin/activate
          python -m pytest --junitxml=pytest.xml --cov-report=term-missing --cov=src tests/
      - name: Generate coverage badge
        run: |
          source .venv/bin/activate
          coverage-badge -o docs/img/coverage.svg -f
      - name: Upload coverage badge and reports
        uses: actions/upload-artifact@v6
        with:
          name: coverage-badge-and-reports
          path: |
            docs/img/coverage.svg
            pytest.xml
          if-no-files-found: error

name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'develop*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    # Changelog entries are files under changelog.d/ (#740), so pull requests
    # do not conflict over CHANGELOG_v2.md. Runs for docs branches too.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Render the changelog fragments
        # Fails on a fragment whose type is unknown; towncrier would drop it
        # without a message at release.
        run: pipx run --spec towncrier==26.9.0 towncrier build --draft --version Unreleased
      - name: Reject new entries written into CHANGELOG_v2.md
        if: ${{ startsWith(github.base_ref, 'develop') }}
        run: |
          # HEAD is the merge commit of the pull request; HEAD^1 is its base.
          # An added top-level bullet is a new entry; other edits are allowed.
          if git diff --unified=0 HEAD^1 HEAD -- CHANGELOG_v2.md | grep -q '^+- '; then
            echo "::error file=CHANGELOG_v2.md::Add the entry as a file in changelog.d/ instead (see changelog.d/README.md)."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    if: ${{ ! ((github.event_name == 'pull_request' && (startsWith(github.head_ref, 'docs-') || startsWith(github.head_ref, 'docs/') || startsWith(github.head_ref, 'doc-') || startsWith(github.head_ref, 'doc/'))) ||
      (github.event_name != 'pull_request' && (startsWith(github.ref_name, 'docs-') || startsWith(github.ref_name, 'docs/') || startsWith(github.ref_name, 'doc-') || startsWith(github.ref_name, 'doc/')))) }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        tox-env: [module, ruff, mypy]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Print
        run: echo "Running tests for Python ${{ matrix.python-version }} with ${{ matrix.tox-env }}"
      - name: Install the Cairo library for the SVG render tests
        if: matrix.tox-env == 'module'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libcairo2
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox
      - name: Test with tox
        env:
          HYPOTHESIS_PROFILE: ci
        run: tox -e py$(echo "${{ matrix.python-version }}" | tr -d .)-${{ matrix.tox-env }}

  test_rs:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: ${{ ! ((github.event_name == 'pull_request' && (startsWith(github.head_ref, 'docs-') || startsWith(github.head_ref, 'docs/') || startsWith(github.head_ref, 'doc-') || startsWith(github.head_ref, 'doc/'))) ||
      (github.event_name != 'pull_request' && (startsWith(github.ref_name, 'docs-') || startsWith(github.ref_name, 'docs/') || startsWith(github.ref_name, 'doc-') || startsWith(github.ref_name, 'doc/')))) }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python development headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install python3-dev

      - name: Install Python development headers (macOS)
        if: runner.os == 'macOS'
        run: brew install python

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          override: true

      - name: Set environment variables
        run: |
          echo "PYTHON_INCLUDE_DIR=$(python3 -c 'from distutils.sysconfig import get_python_inc(); print(get_python_inc())')" >> $GITHUB_ENV
          echo "PYTHON_LIB_DIR=$(python3 -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')" >> $GITHUB_ENV

      - name: Run tests
        run: |
          # Skip Rust tests for PyO3 extension modules
          echo "Skipping Rust tests for PyO3 extension module on ${{ matrix.os }}"
          # PyO3 extension modules cannot be tested with standard cargo test
          # Tests should be run through Python instead

  build-check:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && ! (startsWith(github.head_ref, 'docs-') ||
      startsWith(github.head_ref, 'docs/') || startsWith(github.head_ref, 'doc-') || startsWith(github.head_ref, 'doc/')) }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools
      - name: Build
        run: python -m build

  wheel-install-gate:
    # Phase K ruling #9: the unreachability, Tier-1 surface and wheel-layout
    # pins must hold for the *installed wheel*, not only for the editable tree
    # the tox jobs test. The wheel goes into a clean venv; pytest runs from the
    # repository root because tests/v2 imports the `tests` package, which is
    # safe with the src/ layout: the repo root on sys.path holds no
    # `rdetoolkit` package, so the import resolves to site-packages (asserted).
    runs-on: ubuntu-latest
    if: ${{ ! ((github.event_name == 'pull_request' && (startsWith(github.head_ref, 'docs-') || startsWith(github.head_ref, 'docs/') || startsWith(github.head_ref, 'doc-') || startsWith(github.head_ref, 'doc/'))) ||
      (github.event_name != 'pull_request' && (startsWith(github.ref_name, 'docs-') || startsWith(github.ref_name, 'docs/') || startsWith(github.ref_name, 'doc-') || startsWith(github.ref_name, 'doc/')))) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip
          pip install build maturin
          python -m build --wheel --outdir dist
      - name: Install the Cairo library for the SVG render tests
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libcairo2
      - name: Install the wheel into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --upgrade pip
          wheel="$(ls dist/rdetoolkit-*.whl)"
          # Extras mirror tox (minio, plotly, render) so every shipped module imports;
          # pytest-mpl because pyproject's addopts pass --mpl; build/maturin so
          # the wheel-content tests run instead of skipping.
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install "${wheel}[minio,plotly,render]" pytest pytest-mpl build maturin
      - name: Assert rdetoolkit resolves to the installed wheel
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import pathlib, rdetoolkit
          origin = pathlib.Path(rdetoolkit.__file__).resolve()
          print(origin)
          assert "site-packages" in origin.parts, origin
          assert pathlib.Path("src").resolve() not in origin.parents, origin
          PY
      - name: Run the unreachability / Tier-1 / package-data / wheel-layout tests against the wheel
        run: |
          # The wheel-content tests call `maturin` by name, so the venv's bin
          # directory must be on PATH.
          export PATH="$RUNNER_TEMP/wheel-venv/bin:$PATH"
          python -m pytest -p no:cacheprovider \
            tests/v2/test_unreachability_k2.py \
            tests/v2/compat/test_tier1_surface.py \
            tests/test_package_data.py \
            tests/v2/test_wheel_layout.py

  coverage:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ ! ((github.event_name == 'pull_request' && (startsWith(github.head_ref, 'docs-') || startsWith(github.head_ref, 'docs/') || startsWith(github.head_ref, 'doc-') || startsWith(github.head_ref, 'doc/'))) ||
      (github.event_name != 'pull_request' && (startsWith(github.ref_name, 'docs-') || startsWith(github.ref_name, 'docs/') || startsWith(github.ref_name, 'doc-') || startsWith(github.ref_name, 'doc/')))) }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox
      - name: Test with tox
        env:
          HYPOTHESIS_PROFILE: ci
          # Non-gating runtime baseline (Session K3 ruling #7). py311-module takes
          # no posargs, so the slowest-25 report travels through PYTEST_ADDOPTS,
          # which tox only forwards when told to.
          PYTEST_ADDOPTS: --durations=25
        run: tox -e py311-module -x "testenv:py311-module.pass_env+=PYTEST_ADDOPTS"
      - name: Upload coverage report
        uses: codecov/codecov-action@v7

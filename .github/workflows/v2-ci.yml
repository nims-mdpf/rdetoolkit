name: v2 CI

on:
  pull_request:
    branches: [develop/v2]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    # Keep the former coverage-report context during the migration.
    name: Code Coverage with pytest
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements-dev.lock
            pyproject.toml
      - uses: Swatinem/rust-cache@v2
      - name: Install Cairo for SVG rendering
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libcairo2
      - name: Install dependencies
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -r requirements-dev.lock
          uv pip install --python .venv/bin/python -e '.[minio,plotly,render]'
          # v1 CLI tests spawn bare `python` and `rdetoolkit` from PATH, as the
          # activated venv of the former coverage workflows provided.
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Record the complete test selection
        # Match the former coverage workflows: pyproject excludes legacy only.
        # In particular, do not inherit tox's exclusion of graph_outputs.
        run: |
          mkdir -p ci-results
          .venv/bin/python -m pytest --collect-only -q tests/ > ci-results/test-nodeids.txt
      - name: Run the complete test suite
        run: |
          .venv/bin/python -m pytest tests/ --durations=30 \
            --junitxml=ci-results/junit.xml --cov-config=pyproject.toml \
            --cov=rdetoolkit --cov-fail-under=80 \
            --cov-report=term-missing --cov-report=xml:ci-results/coverage.xml \
            --cov-report=json:ci-results/coverage.json
      - name: Enforce all six Phase H coverage gates
        run: .venv/bin/python scripts/check_phase_h_coverage.py
      - name: Write a concise coverage summary
        run: |
          .venv/bin/python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          coverage = json.loads(Path('ci-results/coverage.json').read_text())
          suites = ET.parse('ci-results/junit.xml').getroot().findall('testsuite')
          counts = {key: sum(int(s.get(key, 0)) for s in suites)
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Python 3.12 full suite\n\n')
              summary.write(f"Tests: {counts}. Coverage: {coverage['totals']['percent_covered']:.2f}%.\n\n")
              summary.write('Overall 80% and all six Phase H 95% gates passed. '
                            'Collection, JUnit and detailed coverage are in the v2-test-results artifact.\n')
          PY
      - name: Validate the complete report set
        run: |
          for report in ci-results/test-nodeids.txt ci-results/junit.xml ci-results/coverage.xml ci-results/coverage.json .coverage; do
            test -s "$report"
          done
      - name: Upload the canonical test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: v2-test-results
          path: |
            ci-results/
            .coverage
          include-hidden-files: true
          if-no-files-found: error

  quality:
    name: v2-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements-dev.lock
            .github/workflows/v2-ci.yml
      - name: Install quality tools
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -r requirements-dev.lock
          # Match the type checker validated by main's current tox resolution.
          # The old lock's mypy 1.18.2 misdiagnoses the InitVar/property alias.
          uv pip install --python .venv/bin/python 'mypy==2.4.1'
      - name: Ruff
        run: .venv/bin/ruff check src/rdetoolkit/
      - name: mypy
        run: .venv/bin/mypy src/

  rust:
    name: v2-rust
    runs-on: ubuntu-latest
    env:
      PYO3_PYTHON: python
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cargo check
        run: cargo check --locked
      - name: Cargo clippy
        run: cargo clippy --locked -- -D warnings -A clippy::useless_conversion
      - name: Cargo test with embedded Python
        run: |
          python_lib="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          export RUSTFLAGS="-L native=$python_lib -lpython3.12"
          export LD_LIBRARY_PATH="$python_lib:${LD_LIBRARY_PATH:-}"
          cargo test --locked --no-default-features --features test

  # The clean-wheel gate is independent of the editable full-suite seat.
  # Its commands and test set match main.yml, including the import-origin pin.
  wheel-install-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: Swatinem/rust-cache@v2
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip
          pip install build maturin
          python -m build --wheel --outdir dist
      - name: Install the Cairo library for the SVG render tests
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libcairo2
      - name: Install the wheel into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --upgrade pip
          wheel="$(ls dist/rdetoolkit-*.whl)"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install "${wheel}[minio,plotly,render]" pytest pytest-mpl build maturin
      - name: Assert rdetoolkit resolves to the installed wheel
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import pathlib, rdetoolkit
          origin = pathlib.Path(rdetoolkit.__file__).resolve()
          print(origin)
          assert "site-packages" in origin.parts, origin
          assert pathlib.Path("src").resolve() not in origin.parents, origin
          PY
      - name: Run the unreachability / Tier-1 / package-data / wheel-layout tests against the wheel
        run: |
          export PATH="$RUNNER_TEMP/wheel-venv/bin:$PATH"
          python -m pytest -p no:cacheprovider \
            tests/v2/test_unreachability_k2.py \
            tests/v2/compat/test_tier1_surface.py \
            tests/test_package_data.py \
            tests/v2/test_wheel_layout.py

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Render changelog fragments
        run: pipx run --spec towncrier==26.9.0 towncrier build --draft --version Unreleased
      - name: Reject new entries written into CHANGELOG_v2.md
        run: |
          if git diff --unified=0 HEAD^1 HEAD -- CHANGELOG_v2.md | grep -q '^+- '; then
            echo '::error file=CHANGELOG_v2.md::Add a changelog.d/ fragment instead.'
            exit 1
          fi

  required:
    # Retain the former badge workflow's context, including on docs branches.
    name: test
    if: ${{ always() }}
    needs: [full-suite, quality, rust, wheel-install-gate, changelog]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          results = json.loads(os.environ['RESULTS'])
          expected = {'full-suite', 'quality', 'rust', 'wheel-install-gate', 'changelog'}
          assert set(results) == expected, results
          assert all(job['result'] == 'success' for job in results.values()), results
          PY

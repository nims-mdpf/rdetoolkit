name: v2 CI

on:
  pull_request:
    branches: [develop/v2]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest-shard:
    # One complete logical suite split into isolated runners by path, so each
    # shard keeps the repository-root working directory the v1 fixtures need.
    # The full-suite job proves that the shards together selected exactly the
    # complete collection and applies every coverage gate to the combined data.
    name: pytest (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Balanced by measured durations (locally, 2026-11: 1371 s of test
        # time in total; about 366 / 360 / 252 / 393 s per shard). The last
        # shard is everything else, so a new directory is never left out.
        include:
          - shard: graph-runner
            paths: tests/v2/graph tests/v2/runner
          - shard: cli-nodes-docs
            paths: tests/v2/cli tests/v2/nodes tests/v2/docs
          - shard: contracts-property
            paths: tests/v2/ga tests/v2/contract tests/v2/modes tests/v2/api tests/v2/testing tests/property
          # The #676 readiness gate is subprocess-bound (several minutes); its own
          # shard keeps the others balanced. The agent-readiness job runs it again
          # against the wheel.
          - shard: acceptance
            paths: tests/v2/acceptance
          - shard: remainder
            paths: >-
              tests
              --ignore=tests/v2/graph --ignore=tests/v2/runner
              --ignore=tests/v2/cli --ignore=tests/v2/nodes --ignore=tests/v2/docs
              --ignore=tests/v2/ga --ignore=tests/v2/contract --ignore=tests/v2/modes
              --ignore=tests/v2/api --ignore=tests/v2/testing --ignore=tests/property
              --ignore=tests/v2/acceptance
    env:
      HYPOTHESIS_PROFILE: ci
      # Absolute, so a test that changes the working directory cannot move it.
      COVERAGE_FILE: ${{ github.workspace }}/ci-results/.coverage.${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: Swatinem/rust-cache@v2
      - name: Install Cairo for SVG rendering
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libcairo2
      - name: Install dependencies
        run: |
          uv sync --locked --python 3.12 --group dev --extra minio --extra plotly --extra render
          # v1 CLI tests spawn bare `python` and `rdetoolkit` from PATH, as the
          # activated venv of the former coverage workflows provided.
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Record the shard's test selection
        # pyproject excludes legacy only; do not inherit tox's exclusion of graph_outputs.
        run: |
          mkdir -p ci-results
          .venv/bin/python -m pytest --collect-only -q ${{ matrix.paths }} > ci-results/nodeids-${{ matrix.shard }}.txt
      - name: Run the shard
        # Thresholds apply to the combined data in full-suite, not per shard.
        # The plugin loads HYPOTHESIS_PROFILE in every shard; only
        # tests/property/conftest.py defines the profiles, and only one shard
        # collects that directory.
        run: |
          .venv/bin/python -m pytest -p scripts.pytest_hypothesis_profile ${{ matrix.paths }} --durations=30 \
            --junitxml=ci-results/junit-${{ matrix.shard }}.xml \
            --cov-config=pyproject.toml --cov=rdetoolkit --cov-report=
      - name: Validate the shard's report set
        run: |
          for report in ci-results/nodeids-${{ matrix.shard }}.txt ci-results/junit-${{ matrix.shard }}.xml ci-results/.coverage.${{ matrix.shard }}; do
            test -s "$report"
          done
      - name: Upload the shard's results
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: v2-shard-${{ matrix.shard }}
          path: ci-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  full-suite:
    # Keep the former coverage-report context during the migration. It runs
    # even when a shard fails, so this required context fails instead of being
    # reported as skipped.
    name: Code Coverage with pytest
    if: ${{ always() }}
    needs: [pytest-shard]
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard to succeed
        env:
          SHARDS: ${{ needs.pytest-shard.result }}
        run: test "$SHARDS" = success
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: uv sync --locked --python 3.12 --group dev --extra minio --extra plotly --extra render
      - name: Download every shard's results
        uses: actions/download-artifact@v8
        with:
          pattern: v2-shard-*
          path: shards
          merge-multiple: true
      - name: Record the complete test selection
        run: |
          mkdir -p ci-results
          .venv/bin/python -m pytest --collect-only -q tests/ > ci-results/test-nodeids.txt
      - name: Require the shards to partition the complete selection
        run: |
          .venv/bin/python scripts/check_test_partition.py ci-results/test-nodeids.txt \
            shards/nodeids-graph-runner.txt shards/nodeids-cli-nodes-docs.txt shards/nodeids-contracts-property.txt shards/nodeids-acceptance.txt shards/nodeids-remainder.txt
      - name: Combine the shards' coverage
        run: |
          .venv/bin/python -m coverage combine --keep --rcfile=pyproject.toml \
            shards/.coverage.graph-runner shards/.coverage.cli-nodes-docs shards/.coverage.contracts-property shards/.coverage.acceptance shards/.coverage.remainder
          .venv/bin/python -m coverage xml --rcfile=pyproject.toml -o ci-results/coverage.xml
          .venv/bin/python -m coverage json --rcfile=pyproject.toml -o ci-results/coverage.json
      - name: Enforce the overall 80% coverage gate
        run: .venv/bin/python -m coverage report --rcfile=pyproject.toml --fail-under=80 --show-missing --skip-covered
      - name: Enforce all six Phase H coverage gates
        run: .venv/bin/python scripts/check_phase_h_coverage.py
      - name: Write a concise coverage summary
        run: |
          .venv/bin/python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          coverage = json.loads(Path('ci-results/coverage.json').read_text())
          suites = [suite for report in sorted(Path('shards').glob('junit-*.xml'))
                    for suite in ET.parse(report).getroot().iter('testsuite')]
          counts = {key: sum(int(s.get(key, 0)) for s in suites)
                    for key in ('tests', 'failures', 'errors', 'skipped')}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Python 3.12 full suite\n\n')
              summary.write(f"Tests: {counts}. Coverage: {coverage['totals']['percent_covered']:.2f}%.\n\n")
              summary.write('Every shard passed, the shards selected exactly the complete suite, and the overall 80% '
                            'and all six Phase H 95% gates passed on the combined data. '
                            'Collection, JUnit and detailed coverage are in the v2-test-results artifact.\n')
          PY
      - name: Validate the complete report set
        run: |
          for report in ci-results/test-nodeids.txt ci-results/coverage.xml ci-results/coverage.json .coverage \
              shards/nodeids-graph-runner.txt shards/nodeids-cli-nodes-docs.txt shards/nodeids-contracts-property.txt shards/nodeids-acceptance.txt shards/nodeids-remainder.txt \
              shards/junit-graph-runner.xml shards/junit-cli-nodes-docs.xml shards/junit-contracts-property.xml shards/junit-acceptance.xml shards/junit-remainder.xml; do
            test -s "$report"
          done
      - name: Upload the canonical test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: v2-test-results
          path: |
            ci-results/
            shards/
            .coverage
          include-hidden-files: true
          if-no-files-found: error

  quality:
    name: v2-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install quality tools
        run: uv sync --locked --python 3.12 --no-install-project --group dev --extra minio --extra plotly --extra render
      - name: requirements*.lock match uv.lock
        run: |
          scripts/export_requirements_locks.sh
          git diff --exit-code -- requirements.lock requirements-dev.lock
      - name: Ruff
        run: .venv/bin/ruff check src/rdetoolkit/
      - name: mypy
        run: .venv/bin/mypy src/

  rust:
    name: v2-rust
    runs-on: ubuntu-latest
    env:
      PYO3_PYTHON: python
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cargo check
        run: cargo check --locked
      - name: Cargo clippy
        run: cargo clippy --locked -- -D warnings -A clippy::useless_conversion
      - name: Cargo test with embedded Python
        run: |
          python_lib="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          export RUSTFLAGS="-L native=$python_lib -lpython3.12"
          export LD_LIBRARY_PATH="$python_lib:${LD_LIBRARY_PATH:-}"
          cargo test --locked --no-default-features --features test

  # The clean-wheel gate is independent of the editable full-suite seat.
  # Its commands and test set match main.yml, including the import-origin pin.
  wheel-install-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: Swatinem/rust-cache@v2
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip
          pip install build maturin
          python -m build --wheel --outdir dist
      - name: Install the Cairo library for the SVG render tests
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libcairo2
      - name: Install the wheel into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --upgrade pip
          wheel="$(ls dist/rdetoolkit-*.whl)"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install "${wheel}[minio,plotly,render]" pytest pytest-mpl build maturin
      - name: Assert rdetoolkit resolves to the installed wheel
        run: |
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import pathlib, rdetoolkit
          origin = pathlib.Path(rdetoolkit.__file__).resolve()
          print(origin)
          assert "site-packages" in origin.parts, origin
          assert pathlib.Path("src").resolve() not in origin.parents, origin
          PY
      - name: Run the unreachability / Tier-1 / retired-agent-guide / wheel-layout tests against the wheel
        run: |
          export PATH="$RUNNER_TEMP/wheel-venv/bin:$PATH"
          python -m pytest -p no:cacheprovider \
            tests/v2/test_unreachability_k2.py \
            tests/v2/compat/test_tier1_surface.py \
            tests/v2/test_retired_agent_guide.py \
            tests/v2/test_wheel_layout.py

  # #676: the coding-agent readiness gate (docs/development/agent-readiness-gate.md)
  # runs the documented agent loop on all five modes against the wheel and an
  # installed, version-matched Skills pack. Dependencies are pinned to uv.lock.
  agent-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: Swatinem/rust-cache@v2
      - name: Build the wheel
        run: uv tool run --from "maturin>=1.4,<2" maturin build --release --out dist
      - name: Install the wheel and pytest into a clean venv
        run: |
          uv export --frozen --no-hashes --no-emit-project --all-groups --all-extras -o "$RUNNER_TEMP/constraints.txt"
          uv venv --python 3.12 "$RUNNER_TEMP/gate-venv"
          uv pip install --python "$RUNNER_TEMP/gate-venv/bin/python" -c "$RUNNER_TEMP/constraints.txt" dist/rdetoolkit-*.whl pytest
      - name: Run the agent readiness gate
        run: python scripts/agent_readiness_gate.py --python "$RUNNER_TEMP/gate-venv/bin/python" --work "$RUNNER_TEMP/agent-readiness"
      - name: Upload the gate's projects, reports and command outputs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-readiness-evidence
          path: ${{ runner.temp }}/agent-readiness
          retention-days: 7

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Render changelog fragments
        run: pipx run --spec towncrier==26.9.0 towncrier build --draft --version Unreleased
      - name: Reject new entries written into CHANGELOG_v2.md
        run: |
          if git diff --unified=0 HEAD^1 HEAD -- CHANGELOG_v2.md | grep -q '^+- '; then
            echo '::error file=CHANGELOG_v2.md::Add a changelog.d/ fragment instead.'
            exit 1
          fi

  required:
    # Retain the former badge workflow's context, including on docs branches.
    name: test
    if: ${{ always() }}
    needs: [pytest-shard, full-suite, quality, rust, wheel-install-gate, agent-readiness, changelog]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          results = json.loads(os.environ['RESULTS'])
          expected = {'pytest-shard', 'full-suite', 'quality', 'rust', 'wheel-install-gate', 'agent-readiness', 'changelog'}
          assert set(results) == expected, results
          assert all(job['result'] == 'success' for job in results.values()), results
          PY

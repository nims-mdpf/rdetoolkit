name: Agent Skills

on:
  pull_request:
    branches: [develop/v2, main]
  push:
    branches: [develop/v2]

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --frozen
      - name: Execute shipped examples and distribution tests
        run: uv run pytest tests/v2/docs/ -v
      - name: Build version-matched offline Skills pack
        run: |
          uv run python scripts/check_version_consistency.py
          uv run python scripts/skills_pack.py build --output skill-dist
      - name: Build runtime artifacts
        run: |
          uv tool run --from "maturin>=1.4,<2" maturin build --release --out dist
          uv tool run --from "maturin>=1.4,<2" maturin sdist --out dist
      - name: Verify runtime package boundaries
        run: uv run python scripts/check_agent_artifacts.py --wheel dist/*.whl --sdist dist/*.tar.gz
      - name: Install wheel in a clean environment
        # Pin dependencies to uv.lock so this job tests the wheel, not whatever
        # newest third-party release happens to resolve that day.
        run: |
          uv export --frozen --no-hashes --no-emit-project --all-groups --all-extras -o /tmp/constraints.txt
          uv venv /tmp/rdetoolkit-wheel
          uv pip install --python /tmp/rdetoolkit-wheel/bin/python -c /tmp/constraints.txt dist/*.whl pytest pytest-mpl pytest-mock hypothesis
          /tmp/rdetoolkit-wheel/bin/python -m rdetoolkit --help
          /tmp/rdetoolkit-wheel/bin/rdetoolkit --help
          /tmp/rdetoolkit-wheel/bin/python -m pytest tests/v2/docs/ -v
      - uses: actions/upload-artifact@v7
        with:
          name: agent-skills
          path: skill-dist/*

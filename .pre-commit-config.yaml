repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
        exclude_types:
          - gitignore
      - id: end-of-file-fixer

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.33.0
    hooks:
      - id: yamllint
        description: A linter (and pre-commit hook) for YAML files that checks syntax and quality.

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.15.0
    hooks:
      - id: pyupgrade
        description: A tool (and pre-commit hook) to automatically upgrade syntax for newer versions of Python.
        language: python
        types_or: [python, pyi]

  # ruff runs from uv.lock, the same version as tox and CI.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --frozen --only-group dev ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        args: [--fix]
        require_serial: true
      - id: ruff-format
        name: ruff-format
        entry: uv run --frozen --only-group dev ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
